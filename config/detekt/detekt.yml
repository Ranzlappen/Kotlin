# Detekt configuration, layered on top of the default config
# (buildUponDefaultConfig = true in the root build.gradle.kts).
# Tuned for Jetpack Compose: composables are PascalCase, take many
# parameters, and use literal dp/sp values by design.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable', 'Preview']

style:
  MagicNumber:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Composable', 'Preview']
  ReturnCount:
    active: false

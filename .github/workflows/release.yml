# Manual release: builds signed release APK + AAB + debug APK and publishes
# a GitHub Release.
#
# Two ways to release:
#   - workflow_dispatch: pick patch/minor/major; the workflow computes the
#     next version from the latest v* tag (first release is v1.0.0), builds,
#     creates the tag, and publishes the Release. No version file to edit —
#     git tags are the single source of truth for versions.
#   - push an explicit tag v*: releases exactly that version.
#
# Signing: with KEYSTORE_* secrets configured the release APK/AAB are
# real-signed; without them they are signed by the committed public fallback
# keystore so every release is still installable (see signing/README.md).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full tag history to compute the next version.
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          set -e
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            CREATE_TAG=false
            echo "Tag push: version=$VERSION"
          else
            LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
            if [ -z "$LATEST" ]; then
              VERSION="1.0.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              case "${{ github.event.inputs.bump }}" in
                major) VERSION="$((MAJOR + 1)).0.0" ;;
                minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
                *)     VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              esac
            fi
            CREATE_TAG=true
            echo "Dispatch (${{ github.event.inputs.bump }}): version=$VERSION"
          fi
          # versionCode = MAJOR*10000 + MINOR*100 + PATCH (caps at 99 each).
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          [ "$VERSION_CODE" -lt 1 ] && VERSION_CODE=1
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Materialize keystore (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            cat > keystore.properties <<EOF
          storeFile=$(pwd)/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Release signing enabled."
          else
            echo "Signing secrets missing; using the committed public fallback keystore."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
          -PversionName=${{ steps.version.outputs.version_name }}
          -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
          -PversionName=${{ steps.version.outputs.version_name }}
          -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
          -PversionName=${{ steps.version.outputs.version_name }}
          -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Bundle release AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon
          -PversionName=${{ steps.version.outputs.version_name }}
          -PversionCode=${{ steps.version.outputs.version_code }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          ls -la dist/

      - name: Create and push tag (dispatch only)
        if: steps.version.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ steps.version.outputs.version_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; aborting." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: v${{ steps.version.outputs.version_name }}
          files: dist/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Cleanup signing materials
        if: always()
        run: rm -f release.keystore keystore.properties || true

name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Tip: the app's
        **Feedback** screen can prefill most of this for you, including the
        environment table.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About shows the version.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device model, Android version, language. The in-app Feedback screen generates this table for you.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recordings
    validations:
      required: false
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing open and closed issues for duplicates.
          required: true
